org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Both opt-outs are still required with AGP 9 + Flutter 3.47.x (the Flutter
# app template ships them too):
# - newDsl=false: the Flutter Gradle plugin casts to the legacy
#   AbstractAppExtension DSL.
# - builtInKotlin=false: several pub plugins (shared_preferences_android,
#   package_info_plus, mobile_scanner, pedometer, flutter_timezone) still apply
#   the 'kotlin-android' plugin, which AGP 9 rejects under built-in Kotlin.
# Remove them once Flutter and those plugins migrate.
android.newDsl=false
android.builtInKotlin=false
