name: qstory
description: "QStory — discover historical places around you using open data from history communities; local-only step & discovery statistics."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  mobx: ^2.7.0
  flutter_mobx: ^2.4.0
  
  # Dependency Injection
  get_it: ^9.3.0
  
  # Networking
  dio: ^5.11.1
  
  # Localization
  intl: ^0.20.3
  
  # QR Operations
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  
  # Permissions
  permission_handler: ^13.0.2

  # Maps
  flutter_map: ^8.3.2
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.1.2

  # Navigation
  go_router: ^18.1.4
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.6
  google_fonts: ^9.0.0
  url_launcher: ^6.3.3
  flutter_local_notifications: ^23.0.0
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  sembast: ^3.10.1
  path_provider: ^2.1.6
  pedometer: ^4.2.0
  fl_chart: ^1.3.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  share_plus: ^13.3.1

  # Email Support
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  mobx_codegen: ^2.7.8
  mockito: ^5.8.1

flutter:
  uses-material-design: true
  generate: true

  # Fonts are bundled so the app never contacts Google Fonts at runtime.
  assets:
    - assets/google_fonts/
