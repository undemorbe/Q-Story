name: qstory
description: "QStory — discover historical places around you using open data from history communities; local-only step & discovery statistics."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  mobx: ^2.3.0
  flutter_mobx: ^2.1.0
  
  # Dependency Injection
  get_it: ^9.2.1
  
  # Networking
  dio: ^5.4.0
  
  # Localization
  intl: ^0.20.2
  
  # QR Operations
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  
  # Permissions
  permission_handler: ^12.0.1

  # Maps
  flutter_map: ^8.0.0
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.1.2

  # Navigation
  go_router: ^17.1.0
  shared_preferences: ^2.5.4
  cached_network_image: ^3.4.1
  google_fonts: ^8.0.1
  url_launcher: ^6.2.5
  flutter_local_notifications: ^21.0.0
  flutter_timezone: ^5.0.1
  timezone: ^0.11.0
  sembast: ^3.10.0
  path_provider: ^2.1.6
  pedometer: ^4.2.0
  fl_chart: ^1.3.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  share_plus: ^13.3.1

  # Email Support
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  mobx_codegen: ^2.3.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  generate: true

  # Fonts are bundled so the app never contacts Google Fonts at runtime.
  assets:
    - assets/google_fonts/
