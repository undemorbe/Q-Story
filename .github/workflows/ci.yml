name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  check:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Code generation (l10n + MobX)
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format & generated code are committed
        run: |
          dart format lib test >/dev/null
          if ! git diff --exit-code --stat -- lib test; then
            echo "::error::Run 'flutter gen-l10n', 'dart run build_runner build -d' and 'dart format lib test', then commit."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  build-android:
    name: Build debug APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: qstory-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
